apiVersion: apps/v1
kind: Deployment
metadata:
  name: wild-frontend
  namespace: wild
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wild-frontend
  template:
    metadata:
      labels:
        app: wild-frontend
    spec:
      containers:
        - name: wild-frontend
          image: salah529/wild-frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: http://backend-service.wild.svc.cluster.local:8080/api/v1
            - name: NEXT_PUBLIC_ENVIRONMENT
              value: docker
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: wild
spec:
  type: LoadBalancer
  selector:
    app: wild-frontend
  ports:
    - port: 3000
      targetPort: 3000
