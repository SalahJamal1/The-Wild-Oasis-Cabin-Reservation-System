apiVersion: apps/v1
kind: Deployment
metadata:
  name: wild-backend
  namespace: wild
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wild-backend
  template:
    metadata:
      labels:
        app: wild-backend
    spec:
      containers:
        - name: wild-backend
          image: salah529/wild-backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql-service:3306/wild_db?createDatabaseIfNotExist=true
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              value: "2025"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: wild
spec:
  type: LoadBalancer
  selector:
    app: wild-backend
  ports:
    - port: 8080
      targetPort: 8080
